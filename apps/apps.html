<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary redirect — fires after 0 seconds -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbytvWkV0w9GHFF9fMaHDKv6fV2SQUFMN7bwOaK-FirOMTRRs-KAuzmAjTGJZp_fMLLd/exec">

  <title>Membuka SAPS…</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0f2540;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Glow orb */
    .glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,.3) 0%, transparent 65%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 24px 64px rgba(0,0,0,.35);
    }

    .logo {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: #2563eb;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 4px 24px rgba(37,99,235,.5);
      animation: pulse-logo 2.5s ease-in-out infinite;
    }
    .logo svg { width: 32px; height: 32px; color: #fff; }

    @keyframes pulse-logo {
      0%,100% { box-shadow: 0 4px 24px rgba(37,99,235,.5); }
      50%      { box-shadow: 0 4px 40px rgba(37,99,235,.85); }
    }

    .system-name {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -.02em;
      margin-bottom: .35rem;
    }

    .system-sub {
      font-size: .78rem;
      color: rgba(255,255,255,.45);
      letter-spacing: .04em;
      margin-bottom: 2.25rem;
    }

    /* Spinner */
    .spinner-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .85rem;
      margin-bottom: 1.25rem;
    }

    .spinner {
      width: 22px; height: 22px;
      border: 2.5px solid rgba(255,255,255,.15);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .redirect-text {
      font-size: .88rem;
      font-weight: 600;
      color: rgba(255,255,255,.75);
    }

    /* Progress bar */
    .progress-track {
      height: 3px;
      background: rgba(255,255,255,.08);
      border-radius: 50px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 50px;
      animation: progress 2.5s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes progress {
      0%   { width: 0%; }
      60%  { width: 75%; }
      100% { width: 100%; }
    }

    .manual-link {
      font-size: .75rem;
      color: rgba(255,255,255,.3);
    }
    .manual-link a {
      color: #60a5fa;
      text-decoration: none;
      transition: color .2s;
    }
    .manual-link a:hover { color: #93c5fd; text-decoration: underline; }

    /* Dot pulse */
    .dots { display: inline-flex; gap: 3px; margin-left: 2px; }
    .dots span {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,.5);
      animation: dot-bounce .9s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes dot-bounce {
      0%,80%,100% { transform: translateY(0); opacity: .5; }
      40%          { transform: translateY(-4px); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="glow"></div>

<div class="card">
  <div class="logo">
    <!-- Graduation cap icon -->
    <svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
      <path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
  </div>

  <div class="system-name">SAPS</div>
  <div class="system-sub">Sistem Analisa Peperiksaan Sekolah</div>

  <div class="spinner-wrap">
    <div class="spinner"></div>
    <div class="redirect-text">
      Mengalihkan ke sistem<span class="dots"><span></span><span></span><span></span></span>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>

  <div class="manual-link">
    Tidak dialihkan?
    <a href="https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbytvWkV0w9GHFF9fMaHDKv6fV2SQUFMN7bwOaK-FirOMTRRs-KAuzmAjTGJZp_fMLLd/exec">
      Klik di sini untuk buka sistem
    </a>
  </div>
</div>

<script>
  // JS redirect as primary fallback (fires immediately)
  window.location.replace(
    "https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbytvWkV0w9GHFF9fMaHDKv6fV2SQUFMN7bwOaK-FirOMTRRs-KAuzmAjTGJZp_fMLLd/exec"
  );
</script>

</body>
</html>
